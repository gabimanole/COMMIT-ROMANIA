# COMMIT Romania Configuration

# Competition Settings
COMPETITION_NAME="COMMIT Romania"
YEAR=2025
ORGANIZER="COMMIT Romania Team"

# Time Limits (in seconds)
DEFAULT_TIME_LIMIT=1
MAX_TIME_LIMIT=5

# Memory Limits (in MB)
DEFAULT_MEMORY_LIMIT=256
MAX_MEMORY_LIMIT=512

# File Settings
SOLUTION_LANGUAGES=["cpp", "c", "java", "python"]
INPUT_FILE_PATTERN="*.txt"
OUTPUT_FILE_PATTERN="*.txt"

# Test Case Settings
MIN_TEST_CASES=3
RECOMMENDED_TEST_CASES=10
MAX_TEST_CASES=50

# Directory Settings
PROBLEMS_DIR="problems"
EXAMPLES_DIR="examples"
TESTS_DIR="tests"
SCRIPTS_DIR="scripts"

# Compiler Settings
CPP_COMPILER="g++"
CPP_FLAGS="-std=c++17 -O2 -Wall"
JAVA_COMPILER="javac"
PYTHON_INTERPRETER="python3"

# Output Settings
ENABLE_COLORED_OUTPUT=true
VERBOSE_TESTING=true